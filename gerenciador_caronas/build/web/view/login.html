<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carona — entrar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo"><span class="marca">CaronaU</span></header>

  <main class="pagina-auth">
    <div class="card-auth">
      <h1>Entrar</h1>
      <p class="subtitulo">Acesse sua conta para solicitar ou oferecer caronas.</p>

      <p id="mensagem-geral" class="mensagem-geral" hidden></p>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" required>
          <div class="campo-erro" id="erro-cpf"></div>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required>
          <div class="campo-erro" id="erro-senha"></div>
        </div>

        <button type="submit" class="botao-principal">Entrar</button>
      </form>

      <p class="rodape-auth">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
    </div>
  </main>

  <script src="js/validacao.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
