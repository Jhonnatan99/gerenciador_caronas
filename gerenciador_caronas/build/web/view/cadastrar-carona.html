<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaronaU — oferecer carona</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <span class="marca">CaronaU</span>
    <nav class="menu">
      <a href="index.html" class="menu-item">Home</a>
      <a href="cadastrar-carona.html" class="menu-item ativo">Oferecer carona</a>
      <a href="perfil.html" class="menu-item">Meu perfil</a>
    </nav>
    <div id="area-usuario" class="usuario-logado"></div>
  </header>

  <main class="conteudo">
    <h1>Oferecer uma carona</h1>

    <p id="mensagem-geral" class="mensagem-geral" hidden></p>

    <form id="form-carona" class="form-carona" novalidate>
      <div class="campo">
        <label for="origem">Origem</label>
        <input type="text" id="origem" name="origem" placeholder="Ex: Campus Central" required>
        <div class="campo-erro" id="erro-origem"></div>
      </div>

      <div class="campo">
        <label for="destino">Destino</label>
        <input type="text" id="destino" name="destino" placeholder="Ex: Terminal Rodoviário" required>
        <div class="campo-erro" id="erro-destino"></div>
      </div>

      <div class="campo">
        <label for="data">Data</label>
        <input type="date" id="data" name="data" required>
        <div class="campo-erro" id="erro-data"></div>
      </div>

      <div class="campo">
        <label for="horario">Horário</label>
        <input type="time" id="horario" name="horario" required>
        <div class="campo-erro" id="erro-horario"></div>
      </div>

      <div class="campo">
        <label for="vagas">Vagas disponíveis</label>
        <input type="number" id="vagas" name="vagas" min="1" max="4" step="1" placeholder="Ex: 3" required>
        <div class="campo-erro" id="erro-vagas"></div>
      </div>

      <div class="campo">
        <label for="valor">Valor por pessoa (R$)</label>
        <input type="number" id="valor" name="valor" min="0.01" step="0.01" placeholder="Ex: 8.50" required>
        <div class="campo-erro" id="erro-valor"></div>
      </div>

      <div class="campo-largo">
        <button type="submit" class="botao-principal">Publicar carona</button>
      </div>
    </form>
  </main>

  <script src="js/validacao.js"></script>
  <script src="js/cadastrar-carona.js"></script>
</body>
</html>
